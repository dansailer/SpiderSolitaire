name: jactionlint

# Lints the workflows and dependabot.yml (https://jactionlint.jdx.dev) with the pedantic profile,
# failing on any finding. Same triggers and guard as CI; the job name is a required status check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jactionlint:
    name: jactionlint
    if: >-
      ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@a65ab044e916760429068fe5794b8306abdfcbb9 # v2.3.0
        with:
          profile: pedantic
          strict-exit: true
