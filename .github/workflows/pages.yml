name: Pages

# Publishes docs/ (the static website) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# Let a newer push replace a queued deployment, but never cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site artifact
    if: ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that this run is the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
