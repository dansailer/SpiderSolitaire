name: CI

# Checks every pull request into main, every push to main and manual runs. The job names are the
# required status checks of the "protect-main" ruleset, so keep them stable.
#
# pull_request (never pull_request_target): runs get a read-only token and no secrets. Jobs run
# only for the owner's same-repository branches; fork pull requests also need a maintainer's
# approval before any workflow runs (all external contributors).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# One run per pull request (or branch); a new push to a pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux tests
    if: >-
      ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    # swift:6.0, pinned by digest.
    container: swift:6.0@sha256:1a1c10372d9c6c0ba9b6151085e0a26ee83a79968b3c738a47a70eac1a70bba4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test

  macos:
    name: macOS build and tests
    if: >-
      ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: swift --version
      - run: swift test
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpiderSolitaire
          path: build/SpiderSolitaire.zip
          if-no-files-found: error
          retention-days: 14

  swiftlint:
    name: SwiftLint
    if: >-
      ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Downloads the static SwiftLint release binary pinned (version and SHA-256) in the script.
      - run: scripts/lint.sh swiftlint

  swift-format:
    name: swift-format
    if: >-
      ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    # swift:6.3.3, pinned by digest: its `swift format` matches the Swift 6.3 toolchain used locally.
    container: swift:6.3.3@sha256:1038d54c80063f5cdfabc4560990c30af64b5de8ebf28161deb22ca4ad5db866
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/lint.sh swift-format
