name: CI

# Only the owner's pushes to main and manual runs. No pull_request (or pull_request_target,
# issue or comment) triggers: this public repository does not run code from forks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (core, board and updates tests)
    if: ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    # swift:6.0, pinned by digest.
    container: swift:6.0@sha256:1a1c10372d9c6c0ba9b6151085e0a26ee83a79968b3c738a47a70eac1a70bba4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test

  macos:
    name: macOS (tests and app bundle)
    if: ${{ github.repository == 'dansailer/SpiderSolitaire' && github.actor == 'dansailer' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: swift --version
      - run: swift test
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpiderSolitaire
          path: build/SpiderSolitaire.zip
          if-no-files-found: error
          retention-days: 14
